[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hamstr-backend"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "aiofiles>=24.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "yt-dlp>=2024.1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "trafilatura>=2.1",
    "readability-lxml>=0.8.1",
    "nh3>=0.2.18",
    "lxml>=6.1.1",
]
